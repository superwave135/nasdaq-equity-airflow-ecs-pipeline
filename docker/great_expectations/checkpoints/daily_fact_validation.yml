name: daily_fact_validation
config_version: 1.0
class_name: SimpleCheckpoint
# Validations are provided at runtime by the DAG (filtered by processing_date).
# Do NOT define static validations here — GX 0.18 merges them with runtime ones,
# causing an unfiltered full-table scan that fails the fact_key uniqueness check.
validations: []
# Actions to take after validation.
action_list:
  - name: store_validation_result
    action:
      class_name: StoreValidationResultAction
  
  - name: update_data_docs
    action:
      class_name: UpdateDataDocsAction
